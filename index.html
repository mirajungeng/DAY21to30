<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>미라정 보카특강</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      :root{
        --fg:#222;--muted:#8a8a8a;--bg:#fafafa;--paper:#fff;--chip:#f2f2f2;
        --primary:#6366f1;
        --primary-600:#4f46e5;--choice:#f4f4f5;--choice-hover:#ececee;
        --ok:#22c55e;--bad:#ef4444;--content-w:860px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Inter","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
      .topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid #eee;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
      /* .brand 스타일 수정: 이미지가 세로 중앙에 오도록 설정 */
      .brand{margin:0; display:flex; align-items:center; font-weight: 900; font-size: 18px;}
      .brand img {height: 32px; w-auto; margin-right: 8px;} 
      .toolbar{display:flex;gap:8px;align-items:center}
      .chip{background:var(--chip);padding:6px 12px;border-radius:999px;color:#444;font-size:13px;font-weight:600}
      .btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;transition:.18s transform,.18s background,.18s box-shadow;font-weight:800; font-family: inherit;}
      .btn:hover{transform:translateY(-1px)}
      .btn:active{transform:translateY(1px)}
      .btn-primary{background:var(--primary);color:#fff}
      .btn-primary:hover{background:var(--primary-600)}
      .btn-ghost{background:#f3f3f3;color:#333}
      .btn-ghost:hover{background:#e9e9e9}
      .btn.small{padding:8px 12px;border-radius:10px}
      .btn.large{padding:14px 24px; font-size:17px;}
      .btn.xlarge{padding:16px 32px;font-size:18px; width:100%;}
      
      .view{display:none;padding:18px; max-width:var(--content-w); margin:0 auto;}
      .view.active{display:block}
      
      .intro-box{background:#fff; border:1px solid #eee; border-radius:20px; padding:40px; text-align:center; margin-top:40px; box-shadow:0 10px 30px rgba(0,0,0,0.05);}
      .step-list {text-align:left; max-width:300px; margin:20px auto; color:#555;}
      .step-list li {margin-bottom:8px;}

      .input-group {margin: 20px 0; display:flex; flex-direction:column; gap:10px; align-items:center;}
      .input-field {padding:12px; border:1px solid #ddd; border-radius:12px; width:100%; max-width:280px; text-align:center; font-size:16px; transition: 0.2s border-color;}
      .input-field:focus {outline: none; border-color: var(--primary);}
      /* 입력 에러 애니메이션 */
      .input-field.error { border-color: var(--bad); animation: shake 0.4s; }
      @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

      select.input-field {appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em;}

      .quiz-container{max-width:600px; margin:40px auto 0 auto; text-align:center;}
      .progress-bar{height:6px; background:#eee; border-radius:3px; margin-bottom:20px; overflow:hidden;}
      .progress-fill{height:100%; background:var(--primary); width:0%; transition:width .3s;}
      
      .word-display{font-size:48px; font-weight:900; margin:30px 0 40px 0; word-break: keep-all; line-height:1.2;}
      .word-display span.label{display:block; font-size:14px; color:var(--muted); font-weight:600; margin-bottom:8px;}
      
      .choices{display:grid; grid-template-columns:1fr; gap:12px;}
      .choice{background:#fff; border:2px solid #eee; border-radius:14px; padding:18px; font-size:18px; font-weight:700; cursor:pointer; transition:.15s;}
      .choice:hover{background:#f9fafb; border-color:#d1d5db;}
      .choice.correct{background:#ecfdf5; border-color:var(--ok); color:var(--ok);}
      .choice.wrong{background:#fef2f2; border-color:var(--bad); color:var(--bad);}
      
      .result-view{text-align:center; padding-top:60px;}
      .score-circle{width:120px; height:120px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; margin:0 auto 24px auto;}
      
      /* 모달 스타일 */
      .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100; opacity:0; pointer-events:none; transition:.2s;}
      .modal.show{opacity:1; pointer-events:auto;}
      .modal-card{background:#fff;border-radius:20px;width:90%;max-width:420px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2); transform:scale(0.9); transition:.2s;}
      .modal.show .modal-card{transform:scale(1);}
      .origin-box {background:#f0f9ff; padding:12px; border-radius:8px; margin-top:10px; font-size:14px; color:#0369a1; text-align: left;}
      .origin-title {font-weight:800; margin-bottom:4px; display:block;}

      @media (max-width:600px){
        .word-display{font-size:36px;}
      }
    </style>
</head>
<body>

    <!-- 상단 바 -->
    <header class="topbar">
        <!-- 텍스트 대신 로고 이미지 태그 사용 -->
        <div class="brand">
            <img src="logo.png" alt="미라정 보카특강" onerror="this.style.display='none'; this.parentNode.innerText='미라정 보카특강'">
        </div>
        <div class="toolbar">
            <span id="day-badge" class="chip" style="display:none; background:#e0e7ff; color:var(--primary);">DAY 21</span>
            <span id="stage-badge" class="chip" style="display:none">Stage 1</span>
            <button id="home-btn" class="btn btn-ghost small" style="display:none">나가기</button>
        </div>
    </header>

    <!-- 1. 메인 화면 -->
    <section id="view-home" class="view active">
        <div class="intro-box">
            <h2 style="font-size:28px; font-weight:900; margin-bottom:10px;">미라정 영어학원</h2>
            <p style="color:var(--muted);">총 4단계의 코스가 순차적으로 진행됩니다.</p>
            
            <ul class="step-list">
                <li>📌 <strong>STEP 1.</strong> 영단어 → 뜻 찾기</li>
                <li>📌 <strong>STEP 2.</strong> 뜻 → 영단어 찾기</li>
                <li>📌 <strong>STEP 3.</strong> 동의어 (Synonym)</li>
                <li>📌 <strong>STEP 4.</strong> 반의어 (Antonym)</li>
            </ul>

            <div class="input-group">
                 <select id="day-select" class="input-field">
                     <option value="DAY 21">DAY 21 (Roots: loc, point...)</option>
                     <option value="DAY 22">DAY 22 (Roots: form, line...)</option>
                     <option value="DAY 23">DAY 23 (Roots: grav, tru...)</option>
                     <option value="DAY 24">DAY 24 (Root: fac, struct)</option>
                     <option value="DAY 25">DAY 25 (Root: meta, vert...)</option>
                     <option value="DAY 26">DAY 26 (Root: volv, rot...)</option>
                     <option value="DAY 27">DAY 27 (Root: ple, fus...)</option>
                     <option value="DAY 28">DAY 28 (Root: sert, tach...)</option>
                     <option value="DAY 29">DAY 29 (Root: part, priv...)</option>
                     <option value="DAY 30">DAY 30 (Roots: equ, ident...)</option>
                 </select>
                 <input id="user-id" type="text" class="input-field" placeholder="이름/ID 입력">
            </div>
            
            <button class="btn btn-primary xlarge" onclick="app.startSequence()">학습 시작하기</button>
        </div>
    </section>

    <!-- 2. 퀴즈 화면 -->
    <section id="view-quiz" class="view">
        <div class="quiz-container">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <div class="status" style="display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-bottom:20px;">
                <span id="remain-count">남은 문제: 0</span>
                <span id="wrong-count" style="color:var(--bad)">오답: 0</span>
            </div>

            <div id="word-display" class="word-display">
                <!-- 단어 표시 영역 -->
            </div>

            <div id="choices" class="choices">
                <!-- 보기 버튼들이 여기 생성됨 -->
            </div>
        </div>
    </section>

    <!-- 3. 결과 화면 -->
    <section id="view-result" class="view">
        <div class="result-view">
            <div class="score-circle">완료!</div>
            <h2>모든 과정 종료</h2>
            <p style="color:var(--muted); margin-bottom:40px;">선택하신 DAY의 학습을 모두 완주하셨습니다.<br>수고하셨습니다!</p>
            <button class="btn btn-primary large" onclick="location.reload()">처음으로 돌아가기</button>
        </div>
    </section>

    <!-- 오답 알림 모달 -->
    <div id="wrong-modal" class="modal">
        <div class="modal-card">
            <h2 style="color:var(--bad); margin-top:0;">오답입니다!</h2>
            <div id="modal-content" style="margin:20px 0; line-height:1.6; font-size:16px;">
                <!-- 정답 내용 표시 -->
            </div>
            <button id="modal-next-btn" class="btn btn-primary xlarge">다음 문제</button>
        </div>
    </div>

    <!-- 단계 완료 알림 모달 (중간 단계용) -->
    <div id="stage-clear-modal" class="modal">
        <div class="modal-card">
            <h2 style="color:var(--primary); margin-top:0;">단계 완료!</h2>
            <p id="stage-clear-msg" style="margin:20px 0; color:#555;">다음 단계로 넘어갑니다.</p>
            <button id="next-stage-btn" class="btn btn-primary xlarge">계속하기</button>
        </div>
    </div>

    <script>
    // ==========================================
    // [데이터 영역] DAY별 데이터 구성
    // ==========================================
    const VOCA_DB = {
        "DAY 21": [
            { en: 'local', ko: '지방의, 지역의, 현지의', syn: 'regional, native', ant: 'global, national', origin: "local(장소) → 특정 장소의" },
            { en: 'locate', ko: '(~에) 두다, 위치시키다', syn: 'position, place, find', ant: 'lose, misplace', origin: "locate(장소) → 어떤 장소에 두다" },
            { en: 'allocate', ko: '할당하다, 배분하다', syn: 'assign, allot, distribute', ant: 'withhold, keep', origin: "al(에) + loc(장소) + ate → 여러 장소에 나누어 두다 (할당하다)" },
            { en: 'point', ko: '가리키다, 지적하다; 점, 요점', syn: 'indicate; spot, gist', ant: 'ignore; expanse', origin: "point(점) → 한 지점을 가리켜 지적하다" },

            { en: 'disappoint', ko: '실망시키다', syn: 'dismay, let down', ant: 'satisfy, please', origin: "dis(반대의) + appoint(지정하다) → 지정한 것과 반대로 움직여 실망시키다" },
            { en: 'punctuate', ko: '구두점을 찍다, 중단시키다', syn: 'interrupt, mark', ant: 'continue', origin: "punct(u)(점) + ate → 점을 찍어 끝나게 중단시키다" },
            { en: 'punctual', ko: '시간을 잘 지키는', syn: 'on time, prompt', ant: 'late, tardy', origin: "punct(점) + ual → 작은 점까지 맞추는" },
            { en: 'confront', ko: '직면하다, 맞서다', syn: 'face, encounter, challenge', ant: 'avoid, evade', origin: "con(함께) + front(앞쪽) → 서로의 앞쪽에 있다 (직면하다)" },

            { en: 'rank', ko: '순위, 등급; 순위를 매기다', syn: 'grade, level, status', ant: 'N/A', origin: "rank(줄) → 줄을 세워 매긴 순위" },
            { en: 'canal', ko: '운하, (체내의) 관', syn: 'channel, waterway', ant: 'N/A', origin: "can(관) + al → 육지에 관 모양으로 파 놓은 큰 물길" },

            { en: 'adequate', ko: '알맞은, 적절한, 충분한', syn: 'sufficient, suitable, enough', ant: 'inadequate, insufficient, unsuitable', origin: "ad(에) + equ(같은) + ate(형접) → 어떤 기준에 딱 맞게 같은, 즉 알맞은" },
            { en: 'equation', ko: '방정식, 등식, 동일시', syn: 'calculation, formula', ant: 'inequality', origin: "equ(같은) + ation(명접) → 양쪽의 값이 같은 방정식 또는 등식" },
            { en: 'equivalent', ko: '동등한, 같은 양의; 동등한 것, 등가물', syn: 'comparable, corresponding, equal', ant: 'different, opposite, dissimilar', origin: "equ(i)(같은) + val(가치 있는) + ent(형접) → 같은 가치가 있는, 즉 동등한" },
            { en: 'identify', ko: '(신원 등을) 확인하다, 식별하다, 동일시하다', syn: 'recognize, distinguish, pinpoint', ant: 'confuse, misidentify', origin: "ident(같은) + ify(동접) → 신분증과 주인이 같은지 확인하다" },
            { en: 'identity', ko: '신원, 정체(성), 동일함', syn: 'individuality, selfhood, character', ant: 'anonymity', origin: "ident(같은) + ity(명접) → 신분증과 같은 사람임, 즉 신원 또는 정체" },
            { en: 'compare', ko: '비교하다, 비교가 되다', syn: 'contrast, match, weigh', ant: 'ignore, overlook', origin: "com(함께) + par(e)(동등한) → 둘을 동등한 선에 함께 놓고 비교하다" },
            { en: 'peer', ko: '또래, 동료, 동등한 사람', syn: 'equal, fellow, contemporary', ant: 'superior, inferior, outsider', origin: "par(동등한)에서 유래 → 동등한 관계, 즉 또래나 동료" },
            { en: 'apparent', ko: '분명히 보이는, 명백한, 겉보기의', syn: 'obvious, clear, evident', ant: 'unclear, hidden, obscure', origin: "ad(~쪽으로) + parent(보이는) → 보이는 쪽으로 있어 분명히 잘 보이는" },
            { en: 'appear', ko: '나타나다, 나오다, 생기다; ~인 것 같다', syn: 'emerge, surface, seem', ant: 'disappear, vanish, hide', origin: "ad(~쪽으로) + pear(보이는) → 보이는 쪽으로 나타나다" },
            { en: 'prepare', ko: '준비하다, 마련하다', syn: 'arrange, organize, get ready', ant: 'neglect, ignore', origin: "pre(앞서) + par(e)(준비하다) → 앞서서 미리 준비하다" },
            { en: 'repair', ko: '수리하다, 회복하다; 수리', syn: 'fix, mend, restore', ant: 'break, damage, destroy', origin: "re(다시) + pair(준비하다) → 고장 난 것을 다시 쓸 수 있도록 준비하다" },
            { en: 'emperor', ko: '황제', syn: 'ruler, monarch, sovereign', ant: 'subject, subordinate', origin: "em(안에) + per(준비하다) + or(명접/사람) → 나라 안의 군대를 준비시킬 권한을 가진 황제" },
            { en: 'similar', ko: '비슷한, 유사한', syn: 'alike, comparable, resembling', ant: 'different, dissimilar, distinct', origin: "similar(비슷한) → 비슷한" },
            { en: 'assimilate', ko: '동화하다, (완전히) 이해하다', syn: 'absorb, integrate, incorporate', ant: 'reject, alienate, separate', origin: "as(~에) + simil(비슷한) + ate(동접) → 어떤 것에 비슷해지게 동화하다" },
            { en: 'simulate', ko: '흉내 내다, 모의실험을 하다, 시뮬레이션하다', syn: 'imitate, mimic, replicate', ant: 'be real, be authentic', origin: "simulate(비슷한) → 어떤 것을 비슷하게 흉내 내다" },
            { en: 'simultaneous', ko: '동시의, 동시에 일어나는', syn: 'concurrent, synchronous, coincident', ant: 'asynchronous, sequential, separate', origin: "simultaneous(비슷한) → 두 일이 비슷하게(동시에) 발생하는" },
            { en: 'resemble', ko: '닮다, 비슷하다', syn: 'look like, take after, mirror', ant: 'differ, contrast', origin: "re(다시) + sembl(e)(비슷한) → 다시 볼 정도로 비슷하게 닮다" },
            { en: 'assemble', ko: '모으다, 모이다, 조립하다', syn: 'gather, collect, construct', ant: 'disperse, scatter, disassemble', origin: "as(~에) + sembl(e)(같이) → 한곳에 여럿을 같이 모으다" },
            { en: 'seemingly', ko: '겉으로 보기에, 보아하니', syn: 'apparently, ostensibly, outwardly', ant: 'actually, genuinely, truly', origin: "seem(ing)(비슷한) + ly(부접) → 정확히 보지 않고 언뜻 비슷하게 겉으로 보기에" },
            { en: 'alter', ko: '바꾸다, 변경하다, 달라지다', syn: 'change, modify, adjust', ant: 'preserve, keep, maintain', origin: "alter(다른) → 다른 것으로 바꾸다" },
            { en: 'alternate', ko: '번갈아 하다, 교대시키다; 번갈아 하는, 교대의; 교대자', syn: 'rotate, interchange, substitute', ant: 'continue, persist', origin: "alter(n)(다른) + ate(동접) → 다른 것과 번갈아 하다" },
            { en: 'altruism', ko: '이타심, 이타주의', syn: 'selflessness, philanthropy, charity', ant: 'selfishness, egoism, greed', origin: "alt(ru)(다른) + ism(명접) → 다른 사람을 위하는 마음, 즉 이타심" },
            { en: 'allergy', ko: '알레르기', syn: 'hypersensitivity, reaction', ant: 'tolerance, immunity', origin: "al(l)(다른) + ergy(일하다) → 음식, 약물 등이 보통과 다르게 일해서 생기는 알레르기" },
            { en: 'alien', ko: '외국의, 외래의, 외계의; 외국인, 외계인', syn: 'foreign, exotic, extraterrestrial', ant: 'native, local, indigenous', origin: "al(i)(다른) + en(형접) → 다른 나라나 장소에서 온" },
            { en: 'alienate', ko: '소외시키다, 멀리하다', syn: 'isolate, distance, estrange', ant: 'unite, reconcile, welcome', origin: "al(i)en(다른) + ate(동접) → 혼자 다른 곳에 있게 소외시키다" },
            { en: 'otherwise', ko: '그렇지 않으면, 그 외에는, 달리', syn: 'or else, differently', ant: 'likewise, similarly', origin: "other(다른) + wise(방향) → 그렇게 하지 않고 다른 방향으로 하면" }
        ]
    };

    // 새로 제공된 구글 앱스 스크립트 URL
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzGqCqUo_HfVYOP4ezWuogvmXhkjcAJtiTe3V0M6ISq9aZsBnPypJXk1Zk9M0LyyZtB/exec';

    // ==========================================
    // [앱 로직]
    // ==========================================
    const app = {
        stage: 1, 
        currentDay: "DAY 21", // 현재 선택된 DAY (기본값 변경)
        queue: [],
        currentWord: null,
        totalInitial: 0,
        wrongCount: 0, 
        userId: '',
        startTime: null, 
        
        init: function() {
            document.getElementById('user-id').addEventListener('change', (e) => {
                this.userId = e.target.value;
            });
            document.getElementById('day-select').addEventListener('change', (e) => {
                this.currentDay = e.target.value;
            });
        },

        startSequence: function() {
            const idInput = document.getElementById('user-id').value.trim();
            const dayInput = document.getElementById('day-select').value;

            if (!idInput) {
                // alert() 대신 시각적 효과
                const input = document.getElementById('user-id');
                input.classList.add('error');
                input.placeholder = "이름을 꼭 입력해주세요!";
                setTimeout(() => input.classList.remove('error'), 1000);
                input.focus();
                return;
            }
            this.userId = idInput;
            this.currentDay = dayInput;
            
            // DAY Badge 업데이트
            const dayBadge = document.getElementById('day-badge');
            dayBadge.textContent = this.currentDay;
            dayBadge.style.display = 'inline-block';

            this.startStage(1); 
        },

        startStage: function(stageNum) {
            this.stage = stageNum;
            
            // 선택된 Day의 데이터를 로드
            if (!VOCA_DB[this.currentDay]) {
                // alert("데이터 로드 오류"); // 예외 처리도 조용히
                console.error("데이터 로드 오류");
                return;
            }
            
            // [수정됨] 스테이지별로 유효한 데이터만 필터링하여 큐 구성
            let targetData = VOCA_DB[this.currentDay];
            
            // Stage 3(동의어): syn 데이터가 있는 것만
            if (stageNum === 3) {
                targetData = targetData.filter(w => w.syn && w.syn.trim() !== "");
            }
            // Stage 4(반의어): ant 데이터가 있는 것만
            else if (stageNum === 4) {
                targetData = targetData.filter(w => w.ant && w.ant.trim() !== "");
            }
            
            this.queue = [...targetData]; // 필터링된 데이터 복사
            this.queue.sort(() => Math.random() - 0.5); 
            
            this.totalInitial = this.queue.length;
            this.wrongCount = 0;
            this.startTime = new Date(); 

            // 필터링 결과 문제가 하나도 없으면 바로 다음 단계로 이동
            if (this.totalInitial === 0) {
                this.finishStage();
                return;
            }

            // UI 업데이트
            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-result').classList.remove('active');
            document.getElementById('view-quiz').classList.add('active');
            
            document.getElementById('home-btn').style.display = 'inline-block';
            document.getElementById('home-btn').onclick = () => location.reload();
            
            const badges = ["", "Step 1. 영단어→뜻", "Step 2. 뜻→영단어", "Step 3. 동의어 찾기", "Step 4. 반의어 찾기"];
            document.getElementById('stage-badge').textContent = badges[stageNum];
            document.getElementById('stage-badge').style.display = 'inline-block';

            this.nextQuestion();
        },

        nextQuestion: function() {
            if (this.queue.length === 0) {
                this.finishStage();
                return;
            }

            const remain = this.queue.length;
            const progress = ((this.totalInitial - remain) / this.totalInitial) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('remain-count').textContent = `남은 문제: ${remain}`;
            document.getElementById('wrong-count').textContent = `오답: ${this.wrongCount}`;

            this.currentWord = this.queue.shift(); 
            this.renderQuestion();
        },

        renderQuestion: function() {
            const word = this.currentWord;
            const displayEl = document.getElementById('word-display');
            const choicesEl = document.getElementById('choices');
            choicesEl.innerHTML = '';

            let questionText = '';
            let labelText = '';
            let answerText = '';
            let distractors = [];

            if (this.stage === 1) {
                labelText = "다음 단어의 뜻은?";
                questionText = word.en;
                answerText = word.ko;
                distractors = this.getDistractors('ko', word.ko);
            }
            else if (this.stage === 2) {
                labelText = "다음 뜻을 가진 영단어는?";
                questionText = word.ko;
                answerText = word.en;
                distractors = this.getDistractors('en', word.en);
            }
            else if (this.stage === 3) {
                labelText = "다음 단어의 동의어(Synonym)는?";
                questionText = word.en;
                answerText = word.syn || "(동의어 없음)";
                distractors = this.getDistractors('syn', word.syn);
            }
            else if (this.stage === 4) {
                labelText = "다음 단어의 반의어(Antonym)는?";
                questionText = word.en;
                answerText = word.ant || "(반의어 없음)";
                distractors = this.getDistractors('ant', word.ant);
            }

            displayEl.innerHTML = `<span class="label">${labelText}</span>${questionText}`;
            
            let options = [answerText, ...distractors];
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'choice';
                btn.textContent = opt === "" ? "(없음)" : opt;
                
                // 정답이 비어있거나 '없음'인 경우 처리 (데이터에 빈 문자열이 있을 수 있음)
                if(opt === answerText) {
                    btn.onclick = () => this.checkAnswer(opt, answerText, btn);
                } else {
                    btn.onclick = () => this.checkAnswer(opt, answerText, btn);
                }
                choicesEl.appendChild(btn);
            });
        },

        getDistractors: function(key, currentVal) {
            // 현재 선택된 Day의 데이터 풀에서 오답을 추출
            const currentPool = VOCA_DB[this.currentDay];
            const pool = currentPool
                .filter(item => item[key] !== currentVal && item[key] !== "") // 정답 아니고 빈값 아닌것
                .map(item => item[key]);
            
            pool.sort(() => Math.random() - 0.5);
            
            // 풀이 부족할 경우 기본값 추가
            while (pool.length < 3) { pool.push('-'); }
            return pool.slice(0, 3);
        },

        checkAnswer: function(selected, correct, btnElement) {
            const choices = document.querySelectorAll('.choice');
            choices.forEach(c => c.style.pointerEvents = 'none');

            if (selected === correct) {
                btnElement.classList.add('correct');
                this.playSound(true);
                setTimeout(() => this.nextQuestion(), 600);
            } else {
                btnElement.classList.add('wrong');
                this.playSound(false);
                this.wrongCount++;
                this.queue.push(this.currentWord); 

                this.sendData(this.currentWord);

                choices.forEach(c => {
                    if (c.textContent === correct) c.classList.add('correct');
                });

                setTimeout(() => {
                    this.showWrongModal(correct);
                }, 500);
            }
        },

        showWrongModal: function(correctAnswer) {
            const modal = document.getElementById('wrong-modal');
            const content = document.getElementById('modal-content');
            const nextBtn = document.getElementById('modal-next-btn');

            const w = this.currentWord;
            const displayAnswer = correctAnswer === "" ? "(없음)" : correctAnswer;
            
            let html = `<p style="color:#666; margin-bottom:5px;">정답은:</p>`;
            html += `<h1 style="color:var(--primary); margin:0 0 15px 0;">${displayAnswer}</h1>`;
            
            html += `<div style="background:#f5f5f5; padding:15px; border-radius:10px; text-align:left; font-size:15px; color:#444;">`;
            html += `<p style="margin:4px 0;"><strong>단어:</strong> ${w.en}</p>`;
            html += `<p style="margin:4px 0;"><strong>뜻:</strong> ${w.ko}</p>`;
            html += `<p style="margin:4px 0;"><strong>동의어:</strong> ${w.syn || '-'}</p>`;
            html += `<p style="margin:4px 0;"><strong>반의어:</strong> ${w.ant || '-'}</p>`;
            
            if (w.origin) {
                html += `<div class="origin-box">
                             <span class="origin-title">💡 어원 풀이</span>
                             ${w.origin}
                          </div>`;
            }
            html += `</div>`;

            content.innerHTML = html;
            modal.classList.add('show');

            nextBtn.onclick = () => {
                modal.classList.remove('show');
                this.nextQuestion();
            };
        },

        finishStage: function() {
            if (this.stage < 4) {
                const modal = document.getElementById('stage-clear-modal');
                const msg = document.getElementById('stage-clear-msg');
                const btn = document.getElementById('next-stage-btn');
                
                const nextStepNames = ["", "", "뜻 찾기(Step 2)", "동의어(Step 3)", "반의어(Step 4)"];
                msg.innerHTML = `수고하셨습니다!<br>곧 <strong>${nextStepNames[this.stage + 1]}</strong> 학습이 시작됩니다.`;
                
                modal.classList.add('show');
                
                btn.onclick = () => {
                    modal.classList.remove('show');
                    this.startStage(this.stage + 1);
                };
            } else {
                document.getElementById('view-quiz').classList.remove('active');
                document.getElementById('view-result').classList.add('active');
            }
        },

        getDuration: function() {
            if (!this.startTime) return "00:00";
            const now = new Date();
            const diffMs = now - this.startTime;
            const diffSec = Math.floor(diffMs / 1000);
            const min = Math.floor(diffSec / 60);
            const sec = diffSec % 60;
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        },

        sendData: function(wrongWordObj) {
            if(!GOOGLE_SHEET_URL) return;

            const data = {
                name: this.userId,                  
                day: `${this.currentDay} - Stage ${this.stage}`, // DAY 정보와 스테이지 함께 전송
                score: `진행중 (${this.wrongCount}회 오답)`, 
                wrongWords: wrongWordObj ? `${wrongWordObj.en} (${wrongWordObj.ko})` : "없음", 
                duration: this.getDuration()        
            };
            
            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                console.log("오답 데이터 전송 완료");
            }).catch(e => console.log('전송 실패', e));
        },

        playSound: function(isCorrect) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            }
        }
    };

    app.init();
    </script>
